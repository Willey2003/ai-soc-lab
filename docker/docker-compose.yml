version: '3.8'

services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.0
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - network.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-indexer-certs:/etc/wazuh-indexer/certs
      - ./config/wazuh-indexer/opensearch.yml:/etc/wazuh-indexer/opensearch.yml:ro
    networks:
      - soc-lab
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:${WAZUH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_ADMIN_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - WAZUH_API_USER=wazuh-api
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-etc:/var/ossec/etc
      - ./config/wazuh-manager/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./config/wazuh-manager/rules:/var/ossec/etc/rules:ro
      - ./config/wazuh-manager/decoders:/var/ossec/etc/decoders:ro
    networks:
      - soc-lab
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.0
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "443:5601"
    environment:
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_API_URL=https://wazuh-manager:55000
      - WAZUH_ADMIN_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      - wazuh-dashboard-data:/usr/share/wazuh-dashboard/data
      - ./config/wazuh-dashboard/opensearch_dashboards.yml:/etc/wazuh-dashboard/opensearch_dashboards.yml:ro
    networks:
      - soc-lab
    depends_on:
      wazuh-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    volumes:
      - netalertx-data:/data
      - /etc/localtime:/etc/localtime:ro
      - ./config/netalertx/config.json:/app/config.json:ro
    environment:
      - PORT=20211
      - LISTEN_ADDR=${BIND_HOST}
      - APP_CONF_OVERRIDE={"GRAPHQL_PORT":"20212","SCAN_SUBNETS":"['${SCAN_SUBNET}']"}
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700
    networks:
      - soc-lab
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:20211/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  wazuh-airia-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
    container_name: wazuh-airia-forwarder
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - AIRIA_API_URL=${AIRIA_API_URL}
      - AIRIA_API_KEY=${AIRIA_API_KEY}
      - LOCAL_API_KEY=${HELPER_API_KEY}
      - LOCAL_API_HEADER=X-API-Key
      - WAZUH_ALERTS_FILE=/var/ossec/logs/alerts/alerts.json
      - ANALYSES_FILE=/var/lib/wazuh-airia-forwarder/analyses.jsonl
      - STATE_FILE=/var/lib/wazuh-airia-forwarder/state.json
      - BIND_HOST=0.0.0.0
      - BIND_PORT=8010
      - REQUEST_TIMEOUT_SECONDS=120
      - FORWARD_EXISTING_ON_FIRST_START=false
      - INCLUDE_FILE_DIFF=false
      - LOG_LEVEL=INFO
    volumes:
      - wazuh-manager-logs:/var/ossec/logs:ro
      - forwarder-data:/var/lib/wazuh-airia-forwarder
      - ./config/forwarder/wazuh_airia_forwarder.py:/opt/wazuh-airia-forwarder/wazuh_airia_forwarder.py:ro
    networks:
      - soc-lab
    depends_on:
      wazuh-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/wazuh-airia-forwarder

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource,yesoreyeram-infinity-datasource
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      - GF_LOG_LEVEL=info
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - soc-lab
    depends_on:
      - wazuh-indexer
      - netalertx
      - wazuh-airia-forwarder
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    restart: unless-stopped
    user: root
    volumes:
      - wazuh-manager-logs:/var/ossec/logs:ro
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./config/filebeat/certs:/etc/filebeat/certs:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - soc-lab
    depends_on:
      - wazuh-manager
    command: ["--strict.perms=false"]

volumes:
  wazuh-indexer-data:
  wazuh-indexer-certs:
  wazuh-manager-data:
  wazuh-manager-logs:
  wazuh-manager-etc:
  wazuh-dashboard-data:
  netalertx-data:
  forwarder-data:
  grafana-data:
  filebeat-data:

networks:
  soc-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16