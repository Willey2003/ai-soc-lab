<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@localhost</email_from>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <agentless>
    <enabled>no</enabled>
  </agentless>

  <connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
    <max_log_size>100M</max_log_size>
  </connection>

  <auth>
    <enabled>yes</enabled>
    <port>1515</port>
    <ssl_agent_ca>/var/ossec/etc/sslmanager.cert</ssl_agent_ca>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <limit_maxagents>yes</limit_maxagents>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>wazuh-manager</node_name>
    <node_type>master</node_type>
    <key>/var/ossec/etc/cluster.key</key>
    <interval>15</interval>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh-manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <analysisd>
    <default_timeframe>3600</default_timeframe>
    <max_timeframe>86400</max_timeframe>
    <rule_cache_size>100000</rule_cache_size>
    <event_queue_size>16384</event_queue_size>
    <syscheck_event_queue_size>16384</syscheck_event_queue_size>
    <rootcheck_event_queue_size>16384</rootcheck_event_queue_size>
    <sca_event_queue_size>16384</sca_event_queue_size>
    <hostinfo_event_queue_size>16384</hostinfo_event_queue_size>
    <winevt_event_queue_size>16384</winevt_event_queue_size>
    <statistical_event_queue_size>16384</statistical_event_queue_size>
    <decoder_event_queue_size>16384</decoder_event_queue_size>
    <alert_queue_size>16384</alert_queue_size>
    <event_queue_size>16384</event_queue_size>
    <max_eps>5000</max_eps>
  </analysisd>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore>no</auto_ignore>
    <alert_new_files>yes</alert_new_files>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore>/etc/ld.so.cache</ignore>
    <ignore>/etc/cache</ignore>
    <ignore>/etc/.updated</ignore>
    <ignore>/etc/.pwd.lock</ignore>
    <ignore>/etc/aliases.db</ignore>
    <ignore>/var/lib/wazuh-airia-forwarder</ignore>
    <nodiff>/etc/ssl/openssl.cnf</nodiff>
    <directories check_all="yes" report_changes="yes" realtime="yes">/var/ossec/logs/alerts</directories>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_dev>yes</check_dev>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_sys>yes</check_sys>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>yes</check_unixaudit>
    <check_winapps>yes</check_winapps>
    <check_winaudit>yes</check_winaudit>
    <check_winmalware>yes</check_winmalware>
    <skip_nfs>yes</skip_nfs>
    <readall>no</readall>
  </rootcheck>

  <wodle name="open-scap">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan_on_start>yes</scan_on_start>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan_on_start>yes</scan_on_start>
    <java_path>/usr/lib/jvm/default-java/bin/java</java_path>
  </wodle>

  <wodle name="aws-s3">
    <disabled>yes</disabled>
    <interval>10m</interval>
    <scan_on_start>yes</scan_on_start>
  </wodle>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <wodle name="vulnerability-detector">
    <disabled>no</disabled>
    <interval>5m</interval>
    <scan_on_start>yes</scan_on_start>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="debian">
      <enabled>yes</enabled>
      <os>stretch</os>
      <os>buster</os>
      <os>bullseye</os>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="redhat">
      <enabled>yes</enabled>
      <os>7</os>
      <os>8</os>
      <os>9</os>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="amazon">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="alpine">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="oracle">
      <enabled>yes</enabled>
      <os>7</os>
      <os>8</os>
      <os>9</os>
      <update_interval>1h</update_interval>
    </provider>
    <provider name="microsoft">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </wodle>

  <logall_json>no</logall_json>

  <email_notification>no</email_notification>

  <reports>
    <enabled>no</enabled>
    <category>syscheck</category>
    <category>rootcheck</category>
    <category>sca</category>
    <category>vulnerability-detector</category>
    <category>inventory</category>
    <category>security-configuration</category>
    <title>Wazuh Report</title>
    <email_to>admin@localhost</email_to>
  </reports>

  <api>
    <enabled>yes</enabled>
    <port>55000</port>
    <bind_addr>0.0.0.0</bind_addr>
    <https>yes</https>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <limit_maxagents>yes</limit_maxagents>
    <purge_agents>yes</purge_agents>
    <purge_interval>1d</purge_interval>
  </api>

  <output>
    <output>
      <type>json</type>
      <location>/var/ossec/logs/alerts/alerts.json</location>
      <filter>
        <level>3</level>
      </filter>
    </output>
    <output>
      <type>syslog</type>
      <location>wazuh-indexer:9200</location>
      <filter>
        <level>3</level>
      </filter>
    </output>
  </output>
</ossec_config>