# Nothing outside this namespace can open connections into it.
# (kubectl port-forward still works; it doesn't go through pod networking.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Only the triage pod may call Ollama.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-triage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soc-triage
      ports:
        - port: 11434
---
# The triage API is reachable from inside this namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triage-from-namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soc-triage
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8020
