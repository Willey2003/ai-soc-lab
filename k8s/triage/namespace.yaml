apiVersion: v1
kind: Namespace
metadata:
  name: soc-triage
  labels:
    # Ollama's image runs as root, so enforce "baseline"; the triage pod itself
    # meets "restricted", and anything that doesn't is flagged as a warning.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
