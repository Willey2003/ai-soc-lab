apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: soc-lab

resources:
  - ../../base

commonLabels:
  environment: development

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: wazuh-indexer
        namespace: soc-lab
      spec:
        template:
          spec:
            containers:
              - name: wazuh-indexer
                resources:
                  requests:
                    memory: "1Gi"
                    cpu: "500m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wazuh-manager
        namespace: soc-lab
      spec:
        template:
          spec:
            containers:
              - name: wazuh-manager
                resources:
                  requests:
                    memory: "1Gi"
                    cpu: "250m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: soc-lab
      spec:
        template:
          spec:
            containers:
              - name: grafana
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "50m"
                  limits:
                    memory: "512Mi"
                    cpu: "250m"

replicas:
  - name: wazuh-manager
    count: 1
  - name: netalertx
    count: 1
  - name: grafana
    count: 1

configMapGenerator:
  - name: netalertx-config
    behavior: replace
    literals:
      - config.json={"GRAPHQL_PORT":"20212","SCAN_SUBNETS":"['10.0.0.0/8']","SCAN_INTERVAL":600,"LOG_LEVEL":"debug"}