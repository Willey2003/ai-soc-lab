apiVersion: v1
kind: Secret
metadata:
  name: soc-lab-secrets
  namespace: soc-lab
type: Opaque
stringData:
  wazuh-admin-password: "CHANGE_ME_WAZUH_ADMIN_PASSWORD"
  wazuh-api-password: "CHANGE_ME_WAZUH_API_PASSWORD"
  wazuh-grafana-password: "CHANGE_ME_WAZUH_GRAFANA_PASSWORD"
  grafana-admin-password: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"
  airia-api-url: "CHANGE_ME_AIRIA_API_URL"
  airia-api-key: "CHANGE_ME_AIRIA_API_KEY"
  helper-api-key: "CHANGE_ME_HELPER_API_KEY"
  netalertx-api-token: "CHANGE_ME_NETALERTX_API_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-certs
  namespace: soc-lab
type: Opaque
data:
  root-ca.pem: ""
  indexer.pem: ""
  indexer.key: ""
  dashboard.pem: ""
  dashboard.key: ""
  sslmanager.cert: ""
  sslmanager.key: ""
  cluster.key: ""