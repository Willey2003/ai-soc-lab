apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalertx
  namespace: soc-lab
  labels:
    app: netalertx
    component: network-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netalertx
  template:
    metadata:
      labels:
        app: netalertx
        component: network-monitoring
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netalertx
          image: ghcr.io/netalertx/netalertx:latest
          ports:
            - containerPort: 20211
              name: web
              hostPort: 20211
            - containerPort: 20212
              name: graphql
              hostPort: 20212
          env:
            - name: PORT
              value: "20211"
            - name: LISTEN_ADDR
              value: "0.0.0.0"
            - name: APP_CONF_OVERRIDE
              value: '{"GRAPHQL_PORT":"20212","SCAN_SUBNETS":"['"'"'192.168.0.0/24'"'"']"}'
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 20211
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 20211
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 20211
            runAsGroup: 20211
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalertx-data
        - name: config
          configMap:
            name: netalertx-config
            items:
              - key: config.json
                path: config.json
---
