apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-airia-forwarder
  namespace: soc-lab
  labels:
    app: wazuh-airia-forwarder
    component: ai-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-airia-forwarder
  template:
    metadata:
      labels:
        app: wazuh-airia-forwarder
        component: ai-analysis
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: forwarder
          image: willey2003/wazuh-airia-forwarder:latest
          ports:
            - containerPort: 8010
              name: http
          env:
            - name: AIRIA_API_URL
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: airia-api-url
            - name: AIRIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: airia-api-key
            - name: LOCAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: helper-api-key
            - name: LOCAL_API_HEADER
              value: "X-API-Key"
            - name: WAZUH_ALERTS_FILE
              value: "/var/ossec/logs/alerts/alerts.json"
            - name: ANALYSES_FILE
              value: "/var/lib/wazuh-airia-forwarder/analyses.jsonl"
            - name: STATE_FILE
              value: "/var/lib/wazuh-airia-forwarder/state.json"
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: BIND_PORT
              value: "8010"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "120"
            - name: FORWARD_EXISTING_ON_FIRST_START
              value: "false"
            - name: INCLUDE_FILE_DIFF
              value: "false"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: wazuh-logs
              mountPath: /var/ossec/logs
              readOnly: true
            - name: forwarder-data
              mountPath: /var/lib/wazuh-airia-forwarder
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: wazuh-logs
          persistentVolumeClaim:
            claimName: wazuh-manager-logs
        - name: forwarder-data
          persistentVolumeClaim:
            claimName: forwarder-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forwarder-data
  namespace: soc-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-airia-forwarder
  namespace: soc-lab
  labels:
    app: wazuh-airia-forwarder
spec:
  type: ClusterIP
  ports:
    - port: 8010
      targetPort: 8010
