apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: soc-lab
  labels:
    app: wazuh-dashboard
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
        component: dashboard
    spec:
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.0
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: WAZUH_INDEXER_URL
              value: "https://wazuh-indexer:9200"
            - name: WAZUH_API_URL
              value: "https://wazuh-manager:55000"
            - name: WAZUH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: wazuh-admin-password
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/wazuh-dashboard/data
            - name: config
              mountPath: /etc/wazuh-dashboard/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wazuh-dashboard-data
        - name: config
          configMap:
            name: wazuh-dashboard-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wazuh-dashboard-data
  namespace: soc-lab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-dashboard-config
  namespace: soc-lab
data:
  opensearch_dashboards.yml: |
    opensearch.hosts: ["https://wazuh-indexer:9200"]
    opensearch.ssl.verificationMode: full
    opensearch.ssl.certificateAuthorities: ["/etc/wazuh-dashboard/certs/root-ca.pem"]
    opensearch.username: "grafana_reader"
    opensearch.password: "${WAZUH_GRAFANA_PASSWORD}"
    opensearch.requestHeadersWhitelist: ["securitytenant", "Authorization"]
    server.host: "0.0.0.0"
    server.port: 5601
    server.ssl.enabled: true
    server.ssl.certificate: "/etc/wazuh-dashboard/certs/dashboard.pem"
    server.ssl.key: "/etc/wazuh-dashboard/certs/dashboard.key"
    wazuh.api.host: "https://wazuh-manager:55000"
    wazuh.api.username: "wazuh-api"
    wazuh.api.password: "${WAZUH_API_PASSWORD}"
    wazuh.api.ssl.verificationMode: full
    wazuh.api.ssl.certificateAuthorities: ["/etc/wazuh-dashboard/certs/root-ca.pem"]
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: soc-lab
  labels:
    app: wazuh-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      name: http
  selector:
    app: wazuh-dashboard
