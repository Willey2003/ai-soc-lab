apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: soc-lab
  labels:
    app: wazuh-indexer
    component: indexer
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
        component: indexer
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: wazuh-admin-password
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms2g -Xmx2g"
            - name: bootstrap.memory_lock
              value: "true"
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/wazuh-indexer
            - name: certs
              mountPath: /etc/wazuh-indexer/certs
            - name: config
              mountPath: /etc/wazuh-indexer/opensearch.yml
              subPath: opensearch.yml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: wazuh-indexer-config
            items:
              - key: opensearch.yml
                path: opensearch.yml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: certs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: soc-lab
  labels:
    app: wazuh-indexer
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
    - port: 9300
      targetPort: 9300
      name: transport
  selector:
    app: wazuh-indexer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-manager
  namespace: soc-lab
  labels:
    app: wazuh-manager
    component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
        component: manager
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.0
          ports:
            - containerPort: 1514
              name: agent-tcp
            - containerPort: 1515
              name: agent-auth
            - containerPort: 55000
              name: api
          env:
            - name: WAZUH_INDEXER_URL
              value: "https://wazuh-indexer:9200"
            - name: WAZUH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: wazuh-admin-password
            - name: WAZUH_API_USER
              value: "wazuh-api"
            - name: WAZUH_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soc-lab-secrets
                  key: wazuh-api-password
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: "full"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /var/ossec/data
            - name: logs
              mountPath: /var/ossec/logs
            - name: etc
              mountPath: /var/ossec/etc
            - name: config
              mountPath: /var/ossec/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true
          livenessProbe:
            exec:
              command: ["/var/ossec/bin/wazuh-control", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/var/ossec/bin/wazuh-control", "status"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wazuh-manager-data
        - name: logs
          persistentVolumeClaim:
            claimName: wazuh-manager-logs
        - name: etc
          persistentVolumeClaim:
            claimName: wazuh-manager-etc
        - name: config
          configMap:
            name: wazuh-manager-config
            items:
              - key: ossec.conf
                path: ossec.conf
---
