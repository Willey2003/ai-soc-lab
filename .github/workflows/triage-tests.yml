name: triage-tests

on:
  push:
    paths: ["triage/**", "k8s/triage/**", "scripts/k8s-triage.sh", ".github/workflows/triage-tests.yml"]
  pull_request:
    paths: ["triage/**", "k8s/triage/**", "scripts/k8s-triage.sh", ".github/workflows/triage-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t soc-triage .

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate k8s/triage
        run: |
          cp k8s/triage/secrets.env.example k8s/triage/secrets.env
          kubectl kustomize k8s/triage > rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml
      - name: Every object stays in the soc-triage namespace
        run: |
          source <(sed -n '/^NS=/,/^check_namespace_owner/p' scripts/k8s-triage.sh | head -n -1)
          guard rendered.yaml && echo "guard: all objects inside ${NS}"
